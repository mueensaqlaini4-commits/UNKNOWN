
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Modi Ji 3D Fun Run</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101323;color:white;
 font-family:Arial,sans-serif;
 text-align:center;overflow:hidden;
 touch-action:manipulation;
}
.game{width:100%;max-width:1000px;margin:auto;padding:8px}
h1{font-size:24px;color:#ffbd43;margin:5px}
.stats{
 display:flex;justify-content:space-around;gap:6px;
 margin:8px 0;
}
.stat{
 background:#252e46;padding:9px;border-radius:10px;
 flex:1;font-size:14px;
}
.stat span{color:#ffc34c;font-weight:bold}
#gameBox{
 width:100%;height:min(65vh,550px);
 position:relative;border:3px solid #ffb52e;
 border-radius:14px;overflow:hidden;
 background:#64b5e5;
}
canvas{display:block;width:100%;height:100%}
.overlay{
 position:absolute;inset:0;
 background:#101323dc;
 display:flex;flex-direction:column;
 justify-content:center;align-items:center;
 gap:14px;padding:15px;
}
.overlay h2{color:#ffbd43;font-size:30px;margin:0}
.overlay p{font-size:15px}
button{
 border:0;border-radius:12px;
 background:#ffb52e;color:#171717;
 font-weight:bold;font-size:17px;
 padding:13px 18px;
 touch-action:none;
}
.controls{
 display:flex;justify-content:center;
 align-items:center;gap:9px;margin-top:12px;
}
.controls button{min-width:55px;min-height:50px}
#pause,#sound{
 background:#34435e;color:white;font-size:13px;
}
.hint{font-size:11px;color:#bdc9dc}
</style>
</head>

<body>
<div class="game">

<h1>🇮🇳 MODI JI 3D FUN RUN 😂</h1>

<div class="stats">
 <div class="stat">स्कोर<br><span id="score">0</span></div>
 <div class="stat">☕ चाय<br><span id="tea">0</span></div>
 <div class="stat">🏆 बेस्ट<br><span id="best">0</span></div>
</div>

<div id="gameBox">
 <div id="view" style="width:100%;height:100%"></div>

 <div class="overlay" id="overlay">
  <h2 id="heading">3D FUN RUN 😂</h2>
  <p id="message">चाय और समोसे इकट्ठा करो!</p>
  <button id="play">▶ START GAME</button>
 </div>
</div>

<div class="controls">
 <button id="left">⬅</button>
 <button id="jump">⬆ JUMP</button>
 <button id="right">➡</button>
 <button id="pause">Ⅱ</button>
 <button id="sound">🔊 ON</button>
</div>

<p class="hint">
 मोबाइल पर बटन दबाएँ | कंप्यूटर पर Arrow Keys और Space
</p>

</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from "three";

const $ = id => document.getElementById(id);

let scene,camera,renderer;
let state="menu";
let score=0,tea=0,best=0;
let speed=10,spawnTimer=0;
let objects=[];
let soundEnabled=true;
let audio=null;
let lastTime=0;

try{
 best=Number(localStorage.getItem("modi3DBest")||0);
}catch(e){}
$("best").textContent=best;

// ---------------- SCENE ----------------

scene=new THREE.Scene();
scene.background=new THREE.Color(0x78c9f4);
scene.fog=new THREE.Fog(0x78c9f4,22,65);

camera=new THREE.PerspectiveCamera(
 55,1,0.1,100
);
camera.position.set(0,5.2,10);
camera.lookAt(0,1.1,0);

renderer=new THREE.WebGLRenderer({
 antialias:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;

$("view").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x667744,2));

const sunlight=new THREE.DirectionalLight(0xffffff,2.5);
sunlight.position.set(-5,12,8);
sunlight.castShadow=true;
scene.add(sunlight);

function resize(){
 const w=$("view").clientWidth;
 const h=$("view").clientHeight;
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h,false);
}
window.addEventListener("resize",resize);
resize();

// ---------------- MATERIALS ----------------

const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({
 color,roughness
});

const orange=mat(0xf28b26);
const white=mat(0xf4f1e9);
const skin=mat(0xd99a69);
const black=mat(0x20202a);
const blue=mat(0x293b56);
const gold=mat(0xffbd43);

// ---------------- WORLD ----------------

// Ground
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(200,100),
 mat(0x42a849)
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.08;
ground.position.z=-30;
ground.receiveShadow=true;
scene.add(ground);

// Road
const road=new THREE.Mesh(
 new THREE.PlaneGeometry(9,100),
 mat(0x393e49)
);
road.rotation.x=-Math.PI/2;
road.position.set(0,-.045,-30);
road.receiveShadow=true;
scene.add(road);

// Road lane lines
const lines=[];
for(let i=0;i<24;i++){
 const line=new THREE.Mesh(
  new THREE.BoxGeometry(.09,.025,1.7),
  mat(0xf3f3e5)
 );
 line.position.set(0,.01,-i*3);
 scene.add(line);
 lines.push(line);
}

// Buildings
for(let i=0;i<20;i++){
 for(let side of [-1,1]){
  const height=3+Math.random()*7;
  const building=new THREE.Mesh(
   new THREE.BoxGeometry(3,height,3),
   mat(i%2?0xb2a6d8:0xe6ad82)
  );
  building.position.set(
   side*(7+Math.random()*3),
   height/2,
   -i*5-5
  );
  building.castShadow=true;
  scene.add(building);

  for(let j=0;j<3;j++){
   const window=new THREE.Mesh(
    new THREE.BoxGeometry(.5,.7,.06),
    mat(0xffe9a2)
   );
   window.position.set(
    building.position.x,
    1+j*1.5,
    building.position.z+1.53
   );
   scene.add(window);
  }
 }
}

// Sun
const sun=new THREE.Mesh(
 new THREE.SphereGeometry(1.3,24,24),
 new THREE.MeshBasicMaterial({color:0xffdc52})
);
sun.position.set(12,10,-25);
scene.add(sun);

// ---------------- 3D CHARACTER ----------------

const player=new THREE.Group();
scene.add(player);

const character=new THREE.Group();
player.add(character);

// Body
const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(.48,.85,5,12),
 orange
);
body.position.y=1.55;
body.castShadow=true;
character.add(body);

// Neck
const neck=new THREE.Mesh(
 new THREE.CylinderGeometry(.17,.19,.25,12),
 skin
);
neck.position.y=2.15;
character.add(neck);

// Head
const head=new THREE.Group();
head.position.y=2.5;
character.add(head);

const face=new THREE.Mesh(
 new THREE.SphereGeometry(.43,24,20),
 skin
);
face.scale.set(1,.98,.85);
head.add(face);

// Hair
const hair=new THREE.Mesh(
 new THREE.SphereGeometry(.44,20,12,0,Math.PI*2,0,Math.PI*.55),
 white
);
hair.position.y=.14;
head.add(hair);

// Eyes
for(let side of [-1,1]){
 const eye=new THREE.Mesh(
  new THREE.SphereGeometry(.045,10,10),
  black
 );
 eye.position.set(side*.15,.06,.36);
 head.add(eye);
}

// Beard
const beard=new THREE.Mesh(
 new THREE.SphereGeometry(.31,16,12),
 white
);
beard.scale.set(1,.6,.8);
beard.position.set(0,-.27,.16);
head.add(beard);

// Mouth
const mouth=new THREE.Mesh(
 new THREE.BoxGeometry(.13,.025,.025),
 black
);
mouth.position.set(0,-.15,.37);
head.add(mouth);

// Limb builder
function makeLimb(parent,x,y,upperColor,lowerColor){
 const pivot=new THREE.Group();
 pivot.position.set(x,y,0);
 parent.add(pivot);

 const upper=new THREE.Mesh(
  new THREE.CapsuleGeometry(.14,.42,4,10),
  upperColor
 );
 upper.position.y=-.32;
 pivot.add(upper);

 const elbow=new THREE.Group();
 elbow.position.y=-.65;
 pivot.add(elbow);

 const lower=new THREE.Mesh(
  new THREE.CapsuleGeometry(.105,.38,4,10),
  lowerColor
 );
 lower.position.y=-.28;
 elbow.add(lower);

 return {pivot,elbow};
}

// Arms
const leftArm=makeLimb(character,-.52,1.98,orange,skin);
const rightArm=makeLimb(character,.52,1.98,orange,skin);

// Legs
const leftLeg=makeLimb(character,-.25,1.02,blue,blue);
const rightLeg=makeLimb(character,.25,1.02,blue,blue);

// Shoes
function addShoes(leg){
 const shoe=new THREE.Mesh(
  new THREE.BoxGeometry(.28,.14,.43),
  mat(0x30251e)
 );
 shoe.position.set(0,-.85,.1);
 leg.elbow.add(shoe);
}
addShoes(leftLeg);
addShoes(rightLeg);

// Hands
function addHands(leg){
 const hand=new THREE.Mesh(
  new THREE.SphereGeometry(.13,12,12),
  skin
 );
 hand.position.y=-.68;
 leg.elbow.add(hand);
}
addHands(leftArm);
addHands(rightArm);

// Character starting position
player.position.set(0,0,1);

// Animation function
let runTime=0;

function animateCharacter(dt){
 runTime+=dt*speed*.85;

 if(state==="playing"){
  const swing=Math.sin(runTime)*.65;
  const opposite=Math.sin(runTime+Math.PI)*.65;

  // Arms swing forward and backward
  leftArm.pivot.rotation.x=swing;
  rightArm.pivot.rotation.x=opposite;

  leftArm.elbow.rotation.x=-.35+Math.max(0,-swing)*.5;
  rightArm.elbow.rotation.x=-.35+Math.max(0,-opposite)*.5;

  // Legs move in opposite directions
  leftLeg.pivot.rotation.x=opposite;
  rightLeg.pivot.rotation.x=swing;

  leftLeg.elbow.rotation.x=Math.max(0,-opposite)*.8;
  rightLeg.elbow.rotation.x=Math.max(0,-swing)*.8;

  // Natural body movement
  character.position.y=Math.abs(Math.sin(runTime*2))*.055;
  character.rotation.z=Math.sin(runTime)*.025;

  head.rotation.x=Math.sin(runTime*2)*.025;

 }else{
  leftArm.pivot.rotation.x=0;
  rightArm.pivot.rotation.x=0;
  leftLeg.pivot.rotation.x=0;
  rightLeg.pivot.rotation.x=0;
  character.position.y=0;
 }
}

// ---------------- OBJECTS ----------------

const lanes=[-2.4,0,2.4];

function createTea(){
 const group=new THREE.Group();

 const cup=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.19,.42,20),
  mat(0xf5f2e8)
 );
 group.add(cup);

 const teaLiquid=new THREE.Mesh(
  new THREE.CylinderGeometry(.19,.19,.025,20),
  mat(0x8c481e)
 );
 teaLiquid.position.y=.19;
 group.add(teaLiquid);

 const handle=new THREE.Mesh(
  new THREE.TorusGeometry(.14,.045,8,16),
  mat(0xf5f2e8)
 );
 handle.position.set(.25,0,0);
 group.add(handle);

 return group;
}

function createSamosa(){
 const group=new THREE.Group();

 const samosa=new THREE.Mesh(
  new THREE.ConeGeometry(.34,.55,3),
  mat(0xe8a12c)
 );
 samosa.rotation.y=Math.PI/2;
 group.add(samosa);

 return group;
}

function createObstacle(){
 const group=new THREE.Group();

 const box=new THREE.Mesh(
  new THREE.BoxGeometry(.9,1.1,.9),
  mat(0x74452b)
 );
 box.position.y=.55;
 box.castShadow=true;
 group.add(box);

 const top=new THREE.Mesh(
  new THREE.BoxGeometry(.95,.12,.95),
  mat(0xb57b4d)
 );
 top.position.y=1.12;
 group.add(top);

 return group;
}

function spawnObject(){
 const r=Math.random();
 const type=r<.38?"tea":r<.69?"samosa":"obstacle";

 let object;
 if(type==="tea")object=createTea();
 else if(type==="samosa")object=createSamosa();
 else object=createObstacle();

 object.position.set(
  lanes[Math.floor(Math.random()*3)],
  type==="obstacle"?0:1,
  -28
 );

 scene.add(object);

 objects.push({
  mesh:object,
  type:type,
  collected:false
 });
}

// ---------------- SOUND ----------------

function effect(freq=500,duration=.15){
 if(!soundEnabled)return;

 try{
  if(!audio)audio=new AudioContext();
  if(audio.state==="suspended")audio.resume();

  const osc=audio.createOscillator();
  const gain=audio.createGain();

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.frequency.value=freq;
  gain.gain.setValueAtTime(.12,audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(
   .001,audio.currentTime+duration
  );

  osc.start();
  osc.stop(audio.currentTime+duration);
 }catch(e){}
}

function speak(message){
 if(!soundEnabled||!("speechSynthesis" in window))return;

 speechSynthesis.cancel();

 const speech=new SpeechSynthesisUtterance(message);
 speech.lang="hi-IN";
 speech.rate=1.08;
 speech.pitch=1.1;

 speechSynthesis.speak(speech);
}

$("sound").onclick=()=>{
 soundEnabled=!soundEnabled;
 $("sound").textContent=soundEnabled?"🔊 ON":"🔇 OFF";

 if(!soundEnabled&&"speechSynthesis" in window){
  speechSynthesis.cancel();
 }
};

// ---------------- GAME LOGIC ----------------

let currentLane=1;
let targetX=0;
let jumpVelocity=0;
let onGround=true;

function jump(){
 if(state!=="playing"||!onGround)return;

 jumpVelocity=9;
 onGround=false;
 effect(420,.15);
}

function moveLane(dir){
 if(state!=="playing")return;

 currentLane=Math.max(0,Math.min(2,currentLane+dir));
 targetX=lanes[currentLane];
}

function updateStats(){
 $("score").textContent=score;
 $("tea").textContent=tea;
 $("best").textContent=best;
}

function resetGame(){
 score=0;
 tea=0;
 speed=10;
 spawnTimer=0;
 currentLane=1;
 targetX=0;
 jumpVelocity=0;
 onGround=true;

 player.position.set(0,0,1);
 character.position.y=0;

 objects.forEach(o=>scene.remove(o.mesh));
 objects=[];

 updateStats();
}

function startGame(){
 resetGame();
 state="playing";
 $("overlay").style.display="none";
 speak("नमस्कार दोस्तों! मजेदार मिशन शुरू हो चुका है!");
}

function endGame(){
 if(state!=="playing")return;

 state="over";
 effect(100,.4);

 if(score>best){
  best=score;
  try{
   localStorage.setItem("modi3DBest",best);
  }catch(e){}
 }

 updateStats();

 $("heading").textContent="GAME OVER 😂";
 $("message").textContent="स्कोर: "+score+" | चाय: "+tea;
 $("play").textContent="🔄 PLAY AGAIN";
 $("overlay").style.display="flex";

 speak("अरे भाई साहब! मिशन खत्म हो गया। फिर से कोशिश कीजिए!");
}

function pauseGame(){
 if(state==="playing"){
  state="paused";
  $("heading").textContent="GAME PAUSED";
  $("message").textContent="थोड़ा आराम कर लीजिए!";
  $("play").textContent="▶ RESUME";
  $("overlay").style.display="flex";
 }else if(state==="paused"){
  state="playing";
  $("overlay").style.display="none";
 }
}

$("play").onclick=()=>{
 if(state==="paused"){
  state="playing";
  $("overlay").style.display="none";
 }else{
  startGame();
 }
};

$("pause").onclick=pauseGame;

// ---------------- CONTROLS ----------------

function holdButton(id,dir){
 const btn=$(id);

 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  moveLane(dir);
 });
}

holdButton("left",-1);
holdButton("right",1);

$("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 jump();
});

document.addEventListener("keydown",e=>{
 if(e.repeat)return;

 if(e.key==="ArrowLeft")moveLane(-1);
 if(e.key==="ArrowRight")moveLane(1);
 if(e.code==="Space"){
  e.preventDefault();
  jump();
 }
 if(e.key==="Escape")pauseGame();
});

// ---------------- UPDATE ----------------

function update(dt){
 if(state!=="playing")return;

 score+=Math.floor(dt*10);
 speed=Math.min(20,10+score/250);

 // Smooth movement
 player.position.x+=
  (targetX-player.position.x)*Math.min(1,dt*12);

 // Jump physics
 if(!onGround){
  jumpVelocity-=24*dt;
  player.position.y+=jumpVelocity*dt;

  if(player.position.y<=0){
   player.position.y=0;
   jumpVelocity=0;
   onGround=true;
  }
 }

 // Spawn objects
 spawnTimer+=dt;

 if(spawnTimer>1.25){
  spawnObject();
  spawnTimer=0;
 }

 // Move objects towards player
 for(let i=objects.length-1;i>=0;i--){
  const o=objects[i];

  o.mesh.position.z+=speed*dt;
  o.mesh.rotation.y+=dt*1.5;

  if(o.type!=="obstacle"){
   o.mesh.position.y=
    1+Math.sin(performance.now()*.004+i)*.12;
  }

  const close=Math.abs(o.mesh.position.z-player.position.z)<.65;
  const sameLane=Math.abs(o.mesh.position.x-player.position.x)<1.0;

  if(close&&sameLane){
   if(o.type==="obstacle"){
    // Jump over obstacles
    if(player.position.y<.85){
     endGame();
     return;
    }
   }else if(!o.collected){
    o.collected=true;

    if(o.type==="tea"){
     tea++;
     score+=25;
     effect(650,.2);
     speak("वाह! गरमा गरम चाय मिल गई!");
    }else{
     score+=15;
     effect(850,.15);
     speak("अरे वाह! समोसा भी मिल गया!");
    }

    scene.remove(o.mesh);
    objects.splice(i,1);
    continue;
   }
  }

  if(o.mesh.position.z>12){
   scene.remove(o.mesh);
   objects.splice(i,1);
  }
 }

 // Moving road lines
 for(const line of lines){
  line.position.z+=speed*dt;
  if(line.position.z>8)line.position.z-=72;
 }

 updateStats();
}

// ---------------- DRAW / LOOP ----------------

function animate(time){
 requestAnimationFrame(animate);

 const dt=Math.min((time-lastTime)/1000||0,.04);
 lastTime=time;

 update(dt);
 animateCharacter(dt);

 // Small camera follow
 camera.position.x+=
  (player.position.x*.12-camera.position.x)*dt*2;

 camera.lookAt(player.position.x*.12,1.1,0);

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

</script>
</body>
</html>
