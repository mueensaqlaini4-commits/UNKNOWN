
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Modi Ji Fun Run</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101323;color:white;font-family:Arial,sans-serif;
 display:flex;justify-content:center;align-items:center;min-height:100vh;
 padding:12px;touch-action:manipulation
}
.game{width:100%;max-width:950px;text-align:center}
h1{color:#ffb52e;margin:5px 0 12px;font-size:clamp(22px,5vw,34px)}
.stats{display:flex;justify-content:space-around;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.stat{background:#222b42;border:1px solid #45516c;border-radius:12px;padding:9px 14px;flex:1;min-width:85px}
.stat span{color:#ffc34c;font-weight:bold}
.screen{position:relative;width:100%;overflow:hidden;border:3px solid #ffb52e;border-radius:15px;background:#80d8ff}
canvas{width:100%;display:block}
.overlay{
 position:absolute;inset:0;background:#101323dd;
 display:flex;flex-direction:column;justify-content:center;align-items:center;
 padding:15px;gap:12px
}
.overlay h2{color:#ffbd43;margin:0;font-size:clamp(24px,6vw,38px)}
.overlay p{margin:0}
button{
 border:0;border-radius:12px;padding:13px 18px;
 font-size:16px;font-weight:bold;background:#ffb52e;color:#171717;
 cursor:pointer;touch-action:none
}
button:active{transform:scale(.96)}
.controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px}
.controls button{min-width:65px;min-height:52px;font-size:22px}
#soundBtn{font-size:14px;background:#34435e;color:white}
#pause{background:#34435e;color:white}
.hint{color:#b9c5dc;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="game">
<h1>🇮🇳 MODI JI FUN RUN 😂</h1>

<div class="stats">
 <div class="stat">स्कोर: <span id="score">0</span></div>
 <div class="stat">☕ चाय: <span id="tea">0</span></div>
 <div class="stat">🏆 बेस्ट: <span id="best">0</span></div>
</div>

<div class="screen">
 <canvas id="game" width="900" height="500"></canvas>
 <div class="overlay" id="overlay">
  <h2 id="heading">FUNNY MISSION 😂</h2>
  <p id="message">चाय और समोसे इकट्ठा करो!</p>
  <button id="play">▶ PLAY GAME</button>
 </div>
</div>

<div class="controls">
 <button id="left">⬅</button>
 <button id="jump">⬆ JUMP</button>
 <button id="right">➡</button>
 <button id="pause">Ⅱ</button>
 <button id="soundBtn">🔊 SOUND ON</button>
</div>
<p class="hint">मोबाइल पर बटन दबाएँ • कंप्यूटर पर ← → और Space इस्तेमाल करें</p>
</div>

<script>
const $=id=>document.getElementById(id);
const canvas=$("game");
const ctx=canvas.getContext("2d");

let state="menu";
let score=0,tea=0;
let best=Number(localStorage.getItem("modiFunBest")||0);
let speed=4,frame=0;
let objects=[],particles=[];
let keys={left:false,right:false};
let soundEnabled=true;
let audioContext=null;

$("best").textContent=best;

const player={
 x:110,y:350,w:54,h:90,vy:0,onGround:true
};

function speakFunny(message){
 if(!soundEnabled || !("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const speech=new SpeechSynthesisUtterance(message);
 speech.lang="hi-IN";
 speech.rate=1.08;
 speech.pitch=1.12;
 speech.volume=1;
 speechSynthesis.speak(speech);
}

function playEffect(type){
 if(!soundEnabled)return;
 try{
  if(!audioContext){
   audioContext=new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioContext.state==="suspended")audioContext.resume();

  const sounds={
   coin:[850,.12],tea:[550,.18],hit:[120,.3],jump:[400,.12]
  };
  const sound=sounds[type]||sounds.coin;
  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();

  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.frequency.value=sound[0];
  gain.gain.setValueAtTime(.12,audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
   .001,audioContext.currentTime+sound[1]
  );
  osc.start();
  osc.stop(audioContext.currentTime+sound[1]);
 }catch(e){}
}

$("soundBtn").onclick=()=>{
 soundEnabled=!soundEnabled;
 if(!soundEnabled && "speechSynthesis" in window)speechSynthesis.cancel();
 $("soundBtn").textContent=soundEnabled?"🔊 SOUND ON":"🔇 SOUND OFF";
};

function resetGame(){
 score=0;tea=0;speed=4;frame=0;
 objects=[];particles=[];
 player.x=110;player.y=350;player.vy=0;player.onGround=true;
 keys.left=false;keys.right=false;
 updateStats();
}

function updateStats(){
 $("score").textContent=score;
 $("tea").textContent=tea;
 $("best").textContent=best;
}

function startGame(){
 resetGame();
 state="playing";
 $("overlay").style.display="none";
 speakFunny("नमस्कार दोस्तों! मजेदार मिशन शुरू हो चुका है। चलिए चाय और समोसे की तलाश करते हैं!");
}

function endGame(){
 if(state!=="playing")return;
 state="over";
 playEffect("hit");
 speakFunny("अरे भाई साहब! मिशन में गड़बड़ हो गई। एक बार फिर कोशिश कीजिए!");

 if(score>best){
  best=score;
  localStorage.setItem("modiFunBest",best);
 }
 updateStats();
 $("heading").textContent="GAME OVER 😂";
 $("message").textContent="आपका स्कोर: "+score+" | चाय: "+tea;
 $("play").textContent="🔄 PLAY AGAIN";
 $("overlay").style.display="flex";
}

function togglePause(){
 if(state==="playing"){
  state="paused";
  $("heading").textContent="GAME PAUSED";
  $("message").textContent="थोड़ा आराम कर लीजिए!";
  $("play").textContent="▶ RESUME";
  $("overlay").style.display="flex";
 }else if(state==="paused"){
  state="playing";
  $("overlay").style.display="none";
 }
}

$("play").onclick=()=>{
 if(state==="paused"){
  state="playing";
  $("overlay").style.display="none";
 }else startGame();
};
$("pause").onclick=togglePause;

function jump(){
 if(state!=="playing"||!player.onGround)return;
 player.vy=-15;
 player.onGround=false;
 playEffect("jump");
}

function hold(button,direction){
 const down=e=>{
  e.preventDefault();
  keys[direction]=true;
 };
 const up=e=>{
  e.preventDefault();
  keys[direction]=false;
 };
 button.addEventListener("pointerdown",down);
 button.addEventListener("pointerup",up);
 button.addEventListener("pointerleave",up);
 button.addEventListener("pointercancel",up);
}

hold($("left"),"left");
hold($("right"),"right");
$("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();jump();
});

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")keys.left=true;
 if(e.key==="ArrowRight")keys.right=true;
 if(e.code==="Space"){
  e.preventDefault();jump();
 }
 if(e.key==="Escape")togglePause();
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")keys.left=false;
 if(e.key==="ArrowRight")keys.right=false;
});

function spawnObject(){
 const r=Math.random();
 let type=r<.35?"tea":r<.65?"samosa":"obstacle";
 objects.push({
  x:930,y:type==="obstacle"?390:310+Math.random()*45,
  type,w:type==="obstacle"?45:35,h:type==="obstacle"?55:35
 });
}

function intersects(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&
        a.y<b.y+b.h&&a.y+a.h>b.y;
}

function addParticles(x,y){
 for(let i=0;i<8;i++){
  particles.push({
   x,y,vx:(Math.random()-.5)*6,
   vy:(Math.random()-.5)*6,life:25
  });
 }
}

function update(){
 if(state!=="playing")return;

 frame++;
 score+=1;
 speed=4+Math.min(score/500,4);

 if(keys.left)player.x-=5;
 if(keys.right)player.x+=5;
 player.x=Math.max(0,Math.min(840,player.x));

 player.vy+=.7;
 player.y+=player.vy;

 if(player.y+player.h>=440){
  player.y=440-player.h;
  player.vy=0;
  player.onGround=true;
 }

 if(frame%85===0)spawnObject();

 for(let i=objects.length-1;i>=0;i--){
  const o=objects[i];
  o.x-=speed;

  const hitbox={
   x:player.x+8,y:player.y+8,w:player.w-16,h:player.h-12
  };

  if(intersects(hitbox,o)){
   if(o.type==="obstacle"){
    endGame();
    return;
   }

   if(o.type==="tea"){
    tea++;
    score+=25;
    playEffect("tea");
    speakFunny("वाह! गरमा गरम चाय मिल गई!");
   }else{
    score+=15;
    playEffect("coin");
    speakFunny("अरे वाह! समोसा भी मिल गया!");
   }
   addParticles(o.x,o.y);
   objects.splice(i,1);
  }else if(o.x<-60){
   objects.splice(i,1);
  }
 }

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];
  p.x+=p.vx;p.y+=p.vy;p.life--;
  if(p.life<=0)particles.splice(i,1);
 }

 updateStats();
}

function drawBackground(){
 const sky=ctx.createLinearGradient(0,0,0,500);
 sky.addColorStop(0,"#65c9ff");
 sky.addColorStop(1,"#e0f8ff");
 ctx.fillStyle=sky;
 ctx.fillRect(0,0,900,500);

 // Sun
 ctx.fillStyle="#ffdb4d";
 ctx.beginPath();ctx.arc(770,90,45,0,Math.PI*2);ctx.fill();

 // Buildings
 for(let i=0;i<8;i++){
  const x=i*130-(frame*speed*.25%130);
  ctx.fillStyle=i%2?"#b3a6d8":"#e6ad82";
  ctx.fillRect(x,270,80,170);
  ctx.fillStyle="#fff3a5";
  for(let j=0;j<3;j++)ctx.fillRect(x+15+j*22,290,12,20);
 }

 // Ground
 ctx.fillStyle="#42a849";
 ctx.fillRect(0,440,900,60);
 ctx.fillStyle="#277a32";
 for(let i=0;i<20;i++){
  let x=(i*55-frame*speed)%900;
  ctx.fillRect(x,440,25,7);
 }
}

function drawCharacter(){
 const x=player.x,y=player.y;

 // Shadow
 ctx.fillStyle="#0003";
 ctx.beginPath();
 ctx.ellipse(x+28,442,30,7,0,0,Math.PI*2);ctx.fill();

 // Legs
 ctx.fillStyle="#293b56";
 ctx.fillRect(x+12,y+65,13,25);
 ctx.fillRect(x+31,y+65,13,25);

 // Shoes
 ctx.fillStyle="#30251e";
 ctx.fillRect(x+7,y+85,21,7);
 ctx.fillRect(x+29,y+85,21,7);

 // Body
 ctx.fillStyle="#f28b26";
 ctx.beginPath();
 ctx.roundRect(x+7,y+30,42,43,10);
 ctx.fill();

 // Face
 ctx.fillStyle="#d99a69";
 ctx.beginPath();
 ctx.arc(x+28,y+19,20,0,Math.PI*2);ctx.fill();

 // Hair
 ctx.fillStyle="#eeeeee";
 ctx.beginPath();
 ctx.arc(x+28,y+8,18,Math.PI,Math.PI*2);ctx.fill();
 ctx.fillRect(x+11,y+8,34,5);

 // Eyes
 ctx.fillStyle="#222";
 ctx.fillRect(x+20,y+17,4,3);
 ctx.fillRect(x+33,y+17,4,3);

 // Smile
 ctx.strokeStyle="#5c2820";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(x+28,y+25,7,.15,Math.PI-.15);ctx.stroke();

 // Beard
 ctx.fillStyle="#eee";
 ctx.beginPath();
 ctx.moveTo(x+12,y+27);
 ctx.lineTo(x+44,y+27);
 ctx.lineTo(x+35,y+37);
 ctx.lineTo(x+21,y+37);
 ctx.closePath();ctx.fill();

 // Hand
 ctx.fillStyle="#d99a69";
 ctx.fillRect(x+43,y+42,13,9);
}

function drawObject(o){
 ctx.font="34px Arial";
 if(o.type==="tea")ctx.fillText("☕",o.x,o.y+30);
 else if(o.type==="samosa")ctx.fillText("🥟",o.x,o.y+30);
 else{
  ctx.fillStyle="#74452b";
  ctx.fillRect(o.x,o.y,45,55);
  ctx.fillStyle="#b57b4d";
  ctx.fillRect(o.x+6,o.y+7,33,8);
 }
}

function draw(){
 drawBackground();

 objects.forEach(drawObject);
 drawCharacter();

 particles.forEach(p=>{
  ctx.fillStyle="#ffcb35";
  ctx.globalAlpha=Math.max(0,p.life/25);
  ctx.fillRect(p.x,p.y,6,6);
  ctx.globalAlpha=1;
 });

 if(state==="paused"){
  ctx.fillStyle="#101323aa";
  ctx.fillRect(0,0,900,500);
 }
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
